name: Migration Check

on:
  pull_request:
    branches: [main]

jobs:
  check-migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: six_oclock
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Upgrade npm
        run: npm install -g npm@^11.10.0

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build:api

      - name: Run existing migrations
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: six_oclock
          NODE_ENV: production
        run: npm run typeorm -w @6oclock/api -- migration:run -d dist/data-source.js

      - name: Check for unmigrated schema changes
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: six_oclock
          NODE_ENV: production
        run: |
          npm run typeorm -w @6oclock/api -- migration:generate -d dist/data-source.js CheckPending --check || {
            echo "❌ Schema changes detected without corresponding migration!"
            echo "Please run: npm run migrate -w @6oclock/api -- src/migration/YourMigrationName"
            exit 1
          }
          echo "✓ No unmigrated schema changes detected"
