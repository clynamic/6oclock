  /users/{id}/toggle_uploads.json:
    get:
      operationId: "toggleUserUploads"
      x-access-level: "janitor"
      tags:
        - "users"
      summary: "Toggle a user's ability to upload"
      description: |
        Flips a user's upload ban.

        If the user's uploads are currently enabled, disabling them requires a reason, so the
        action returns the user record instead of acting; submit the reason to
        `/users/{id}/disable_uploads.json`. If the user's uploads are currently disabled, they
        are re-enabled and the response is a redirect.
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "The ID or username of the user"
          schema:
            type: "string"
      responses:
        200:
          description: "The user whose uploads are about to be disabled"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        302:
          description: "Uploads were re-enabled; redirect to the user's profile"
        403:
          description: "Access denied"
        404:
          description: "User not found"
  /users/{id}/disable_uploads.json:
    post:
      operationId: "disableUserUploads"
      x-access-level: "janitor"
      tags:
        - "users"
      summary: "Disable a user's ability to upload"
      description: "Bans a user from uploading and records the supplied reason as a staff note. The reason is mandatory."
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "The ID or username of the user"
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffNoteBody"
      responses:
        302:
          description: "Redirect to the user's profile; the outcome is carried in the flash message"
        403:
          description: "Access denied"
        404:
          description: "User not found"
  /users/{id}/toggle_karma_free.json:
    get:
      operationId: "toggleUserKarmaFree"
      x-access-level: "janitor"
      tags:
        - "users"
      summary: "Toggle a user's unlimited uploads"
      description: |
        Flips a user's karma-free upload ban.

        If the user's unlimited uploads are currently enabled, disabling them requires a reason,
        so the action returns the user record instead of acting; submit the reason to
        `/users/{id}/disable_karma_free.json`. If they are currently disabled, they are
        re-enabled and the response is a redirect. A user below the karma threshold is redirected
        without any change.
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "The ID or username of the user"
          schema:
            type: "string"
      responses:
        200:
          description: "The user whose unlimited uploads are about to be disabled"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        302:
          description: "Unlimited uploads were re-enabled, or the user is not eligible; redirect to the user's profile"
        403:
          description: "Access denied"
        404:
          description: "User not found"
  /users/{id}/disable_karma_free.json:
    post:
      operationId: "disableUserKarmaFree"
      x-access-level: "janitor"
      tags:
        - "users"
      summary: "Disable a user's unlimited uploads"
      description: "Revokes a user's karma-free upload bypass and records the supplied reason as a staff note. The reason is mandatory."
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "The ID or username of the user"
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffNoteBody"
      responses:
        302:
          description: "Redirect to the user's profile; the outcome is carried in the flash message"
        403:
          description: "Access denied"
        404:
          description: "User not found"
