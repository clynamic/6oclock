    OpenidConfiguration:
      type: "object"
      description: "OpenID Connect provider metadata. Members whose value is null are omitted."
      required:
        - "issuer"
        - "authorization_endpoint"
        - "token_endpoint"
        - "revocation_endpoint"
        - "userinfo_endpoint"
        - "jwks_uri"
        - "scopes_supported"
        - "response_types_supported"
        - "response_modes_supported"
        - "grant_types_supported"
        - "token_endpoint_auth_methods_supported"
        - "subject_types_supported"
        - "id_token_signing_alg_values_supported"
        - "claim_types_supported"
        - "claims_supported"
      properties:
        issuer:
          type: "string"
          description: "The issuer identifier"
        authorization_endpoint:
          type: "string"
          description: "The authorization endpoint URL"
        token_endpoint:
          type: "string"
          description: "The token endpoint URL"
        revocation_endpoint:
          type: "string"
          description: "The token revocation endpoint URL"
        introspection_endpoint:
          type: "string"
          description: "The token introspection endpoint URL"
        userinfo_endpoint:
          type: "string"
          description: "The userinfo endpoint URL"
        jwks_uri:
          type: "string"
          description: "The JSON Web Key Set URL"
        end_session_endpoint:
          type: "string"
          nullable: true
          description: "The RP-initiated logout endpoint, when one is configured"
        registration_endpoint:
          type: "string"
          description: "The dynamic client registration endpoint, present only when dynamic registration is enabled"
        scopes_supported:
          type: "array"
          description: "The scopes the provider accepts"
          items:
            $ref: "#/components/schemas/OauthScope"
        response_types_supported:
          type: "array"
          description: "The authorization response types the provider supports"
          items:
            type: "string"
        response_modes_supported:
          type: "array"
          description: "The response modes the provider supports"
          items:
            type: "string"
        grant_types_supported:
          type: "array"
          description: "The grant types the provider supports"
          items:
            type: "string"
        token_endpoint_auth_methods_supported:
          type: "array"
          description: "The client authentication methods the token endpoint accepts"
          items:
            type: "string"
        subject_types_supported:
          type: "array"
          description: "The subject identifier types the provider supports"
          items:
            type: "string"
        id_token_signing_alg_values_supported:
          type: "array"
          description: "The signing algorithms the provider uses for ID tokens"
          items:
            type: "string"
        claim_types_supported:
          type: "array"
          description: "The claim types the provider supports"
          items:
            type: "string"
        claims_supported:
          type: "array"
          description: "The claims the provider can return, being the standard claims plus those configured by the site"
          items:
            type: "string"
        code_challenge_methods_supported:
          type: "array"
          description: "The PKCE code challenge methods the provider accepts"
          items:
            type: "string"
    OauthScope:
      type: "string"
      description: "An OAuth scope. `openid` is the default scope. The rest are optional."
      enum:
        - "openid"
        - "profile"
        - "email"
        - "full"
    Webfinger:
      type: "object"
      required:
        - "subject"
        - "links"
      properties:
        subject:
          type: "string"
          description: "The resource that was requested"
        links:
          type: "array"
          description: "The links describing the resource"
          items:
            $ref: "#/components/schemas/WebfingerLink"
    WebfingerLink:
      type: "object"
      required:
        - "rel"
        - "href"
      properties:
        rel:
          type: "string"
          description: "The relation type, always `http://openid.net/specs/connect/1.0/issuer`"
        href:
          type: "string"
          description: "The issuer identifier"
    Jwks:
      type: "object"
      required:
        - "keys"
      properties:
        keys:
          type: "array"
          description: "The public keys in JWK form"
          items:
            type: "object"
            additionalProperties: true
    Userinfo:
      type: "object"
      description: |
        OpenID Connect claims for the authenticated user. `sub` is always present.
        The remaining claims depend on the scopes granted to the token.
      required:
        - "sub"
      properties:
        sub:
          type: "integer"
          description: "The user ID"
        preferred_username:
          type: "string"
          description: "The account name"
        name:
          type: "string"
          description: "The account name"
        picture:
          type: "string"
          nullable: true
          description: "The avatar URL, or null when the user has no usable avatar"
        updated_at:
          type: "integer"
          description: "When the account was last updated, as a Unix timestamp"
        e621_level:
          type: "integer"
          description: "The numeric user level"
        e621_level_string:
          type: "string"
          description: "The display name of the user level, such as `Member` or `Janitor`"
        e621_avatar_id:
          type: "integer"
          nullable: true
          description: "The post ID used as the account avatar"
        e621_permissions:
          type: "array"
          description: |
            The permission flags the user holds. Contains `is_<role>` for the
            user's level and any capability flags such as `can_approve_posts`.
          items:
            type: "string"
        email:
          type: "string"
          description: "The account email address"
        email_verified:
          type: "boolean"
          description: "Whether the account email address is present and verified"
    CreateOauthTokenBody:
      type: "object"
      required:
        - "grant_type"
        - "client_id"
      properties:
        grant_type:
          type: "string"
          description: "The grant type. `authorization_code` is the only enabled flow, and `refresh_token` may be used to renew a token."
          enum:
            - "authorization_code"
            - "refresh_token"
        client_id:
          type: "string"
          description: "The application's client identifier"
        client_secret:
          type: "string"
          description: "The application's client secret, for confidential clients"
        code:
          type: "string"
          description: "The authorization code, for `grant_type=authorization_code`"
        redirect_uri:
          type: "string"
          description: "The redirect URI used in the authorization request"
        code_verifier:
          type: "string"
          description: "The PKCE code verifier. Required, since PKCE is enforced."
        refresh_token:
          type: "string"
          description: "The refresh token, for `grant_type=refresh_token`"
    OauthToken:
      type: "object"
      required:
        - "access_token"
        - "token_type"
        - "expires_in"
        - "created_at"
      properties:
        access_token:
          type: "string"
          description: "The issued access token"
        token_type:
          type: "string"
          description: "The token type, `Bearer`"
        expires_in:
          type: "integer"
          description: "The token lifetime in seconds"
        refresh_token:
          type: "string"
          description: "The refresh token, when one was issued"
        scope:
          type: "string"
          description: "The granted scopes, space separated"
        created_at:
          type: "integer"
          description: "When the token was issued, as a Unix timestamp"
        id_token:
          type: "string"
          description: "The ID token, when the `openid` scope was granted"
    RevokeOauthTokenBody:
      type: "object"
      required:
        - "token"
      properties:
        token:
          type: "string"
          description: "The access or refresh token to revoke"
        client_id:
          type: "string"
          description: "The application's client identifier"
        client_secret:
          type: "string"
          description: "The application's client secret"
    IntrospectOauthTokenBody:
      type: "object"
      required:
        - "token"
      properties:
        token:
          type: "string"
          description: "The token to introspect"
        client_id:
          type: "string"
          description: "The application's client identifier"
        client_secret:
          type: "string"
          description: "The application's client secret"
    OauthTokenIntrospection:
      type: "object"
      required:
        - "active"
      properties:
        active:
          type: "boolean"
          description: "Whether the token is currently valid"
        scope:
          type: "string"
          description: "The granted scopes, space separated"
        client_id:
          type: "string"
          description: "The client the token was issued to"
        token_type:
          type: "string"
          description: "The token type, `Bearer`"
        iat:
          type: "integer"
          description: "When the token was issued, as a Unix timestamp"
        exp:
          type: "integer"
          description: "When the token expires, as a Unix timestamp. Omitted for tokens that do not expire."
    OauthTokenInfo:
      type: "object"
      required:
        - "resource_owner_id"
        - "scope"
        - "expires_in"
        - "created_at"
      properties:
        resource_owner_id:
          type: "integer"
          description: "The ID of the user who owns the token"
        scope:
          type: "array"
          description: "The granted scopes"
          items:
            type: "string"
        expires_in:
          type: "integer"
          nullable: true
          description: "Seconds until the token expires"
        application:
          type: "object"
          description: "The application the token was issued to"
          properties:
            uid:
              type: "string"
              description: "The application's client identifier"
        created_at:
          type: "integer"
          description: "When the token was issued, as a Unix timestamp"

    DbExport:
      type: "object"
      description: "A database export file offered for download."
      required:
        - "name"
        - "file_name"
        - "file_size"
        - "updated_at"
        - "url"
      properties:
        name:
          type: "string"
          description: "The export name, such as the table it was taken from"
        file_name:
          type: "string"
          description: "The file name, being the export name followed by `.csv.gz`"
        file_size:
          type: "integer"
          description: "The size of the export file in bytes"
        checksum:
          type: "string"
          nullable: true
          description: "The checksum of the export file"
        updated_at:
          type: "string"
          format: "date-time"
          description: "The time when the export was last written"
        url:
          type: "string"
          description: "The URL the export can be downloaded from"

    UserAvatarMenu:
      type: "object"
      description: "Which of the current user's content listings are non-empty."
      required:
        - "has_uploads"
        - "has_favorites"
        - "has_sets"
        - "has_comments"
        - "has_forums"
        - "has_blips"
      properties:
        has_uploads:
          type: "boolean"
          description: "Whether the user has uploaded any posts"
        has_favorites:
          type: "boolean"
          description: "Whether the user has any favorites"
        has_sets:
          type: "boolean"
          description: "Whether the user owns any post sets"
        has_comments:
          type: "boolean"
          description: "Whether the user has posted any comments"
        has_forums:
          type: "boolean"
          description: "Whether the user has posted in the forums"
        has_blips:
          type: "boolean"
          description: "Whether the user has posted any blips"
    UserUploadTags:
      type: "object"
      description: "Tag suggestions for the upload tag editor."
      required:
        - "upload_tags"
        - "recent_tags"
      properties:
        upload_tags:
          type: "array"
          description: "The user's favorite tags, in the order they configured them"
          items:
            $ref: "#/components/schemas/UserUploadTag"
        recent_tags:
          type: "array"
          description: "Up to 50 tags the user added to posts in the last hour, most used first"
          items:
            $ref: "#/components/schemas/UserUploadTag"
    UserUploadTag:
      type: "object"
      description: "A tag suggestion with its post count and category."
      required:
        - "name"
        - "count"
        - "category_id"
      properties:
        name:
          type: "string"
          description: "The tag name"
        count:
          type: "integer"
          description: "The number of posts carrying the tag"
        category_id:
          type: "integer"
          description: "The tag's category ID"
    StaffUserAltListEntry:
      type: "array"
      description: "The user's ID followed by the IDs of accounts sharing their last-seen IP address."
      items:
        oneOf:
          - type: "integer"
            description: "The user's ID"
          - type: "array"
            description: "The IDs of suspected alt accounts"
            items:
              type: "integer"
    UserAlt:
      type: "object"
      description: "A suspected alt account, scored on shared-network evidence. Carries no IP or subnet value."
      required:
        - "user_id"
        - "score"
        - "handoff"
        - "handoff_users"
        - "shared_exact"
        - "shared_subnet"
        - "total_ips"
        - "ratio"
        - "rarest_users"
        - "overlap_first"
        - "overlap_last"
        - "last_co_seen"
        - "concurrent"
        - "deleted"
        - "user"
      properties:
        user_id:
          type: "integer"
          description: "The ID of the candidate account"
        score:
          type: "number"
          format: "float"
          description: "Confidence score from 0 to 100, rounded to one decimal place"
        handoff:
          type: "boolean"
          description: "Whether a shared IP appears to have been handed over from one account to the other"
        handoff_users:
          type: "integer"
          nullable: true
          description: "How many distinct accounts were seen on the IP that triggered the handoff, or null when there was no handoff"
        shared_exact:
          type: "integer"
          description: "Number of exact IP addresses shared with the target"
        shared_subnet:
          type: "integer"
          description: "Number of subnets shared with the target, excluding those already counted as exact matches"
        total_ips:
          type: "integer"
          description: "Number of IP addresses recorded for the candidate in the retention window"
        ratio:
          type: "number"
          format: "float"
          description: "Fraction of the candidate's IP addresses that are shared with the target"
        rarest_users:
          type: "integer"
          description: "The smallest number of distinct accounts seen on any of the shared values"
        overlap_first:
          type: "string"
          format: "date-time"
          description: "Earliest activity on a shared value across both accounts"
        overlap_last:
          type: "string"
          format: "date-time"
          description: "Latest activity on a shared value across both accounts"
        last_co_seen:
          type: "string"
          format: "date-time"
          description: "The most recent time both accounts were still active on the same shared value"
        concurrent:
          type: "boolean"
          description: "Whether the two accounts' activity windows on a shared value actually overlapped"
        deleted:
          type: "boolean"
          description: "Whether the candidate account has been anonymized"
        user:
          $ref: "#/components/schemas/UserAltUser"
    UserAltUser:
      type: "object"
      description: "The identifying fields of a suspected alt account."
      required:
        - "id"
        - "name"
        - "level_string"
        - "created_at"
      properties:
        id:
          type: "integer"
          description: "The unique ID of the user"
        name:
          type: "string"
          description: "The username of the user"
        level_string:
          type: "string"
          description: "The user's access level (textual description)"
        created_at:
          type: "string"
          format: "date-time"
          description: "The timestamp when the user account was created"
    UpdateStaffUserBody:
