    CreateSearchTrendBlacklistBodySearchTrendBlacklist:
      type: "object"
      required:
        - "tag"
      properties:
        tag:
          type: "string"
          description: "The tag pattern to blacklist. A bare `*` is rejected."
        reason:
          type: "string"
          description: "The reason for blacklisting"
    UpdateSearchTrendBlacklistBody:
      type: "object"
      required:
