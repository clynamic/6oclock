                $ref: "#/components/schemas/SearchTrendSettingsResult"
        403:
          description: "Access denied"
  /search_trends/clear_cache.json:
    post:
      operationId: "clearSearchTrendCache"
      x-access-level: "admin"
      tags:
        - "search_trends"
      summary: "Clear the rising tags cache"
      description: "Deletes the cached rising tags list so it is recomputed on the next request."
      responses:
        200:
          description: "The cache was cleared"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchTrendSettingsResult"
        403:
          description: "Access denied"
  /search_trend_blacklists.json:
    get:
      operationId: "getSearchTrendBlacklists"
      x-access-level: "admin"
      tags:
        - "search_trend_blacklists"
      summary: "Get a list of search trend blacklist entries"
      description: "Returns the tag patterns that are excluded from search trend recording."
      parameters:
        - name: "page"
          in: "query"
          required: false
          description: "The page number to retrieve"
          schema:
            type: "integer"
        - name: "limit"
          in: "query"
          required: false
          description: "The number of entries to retrieve per page"
          schema:
            type: "integer"
        - name: "search[tag]"
          in: "query"
          required: false
          description: "Filter by tag pattern"
          schema:
            type: "string"
        - name: "search[reason]"
          in: "query"
          required: false
          description: "Filter by reason"
          schema:
            type: "string"
        - name: "search[id]"
          in: "query"
          required: false
          description: "Filter by blacklist entry ID"
          schema:
            type: "string"
        - name: "search[created_at]"
          in: "query"
          required: false
          description: "Filter by the creation date of the entry"
          schema:
            type: "string"
        - name: "search[updated_at]"
          in: "query"
          required: false
          description: "Filter by the last update date of the entry"
          schema:
            type: "string"
        - name: "search[order]"
          in: "query"
          required: false
          description: "Order the results"
          schema:
            $ref: "#/components/schemas/GetSearchTrendBlacklistsSearchOrder"
      responses:
        200:
          description: "A list of search trend blacklist entries"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/SearchTrendBlacklist"
        403:
          description: "Access denied"
        500:
          description: "Server error"
    post:
      operationId: "createSearchTrendBlacklist"
      x-access-level: "admin"
      tags:
        - "search_trend_blacklists"
      summary: "Create a search trend blacklist entry"
      description: "Blacklists a tag pattern from search trend recording. The pattern supports the `*` and `?` globs, but a bare `*` is rejected."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSearchTrendBlacklistBody"
      responses:
        201:
          description: "The created blacklist entry"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchTrendBlacklist"
        403:
          description: "Access denied"
        422:
          description: "Validation error"
  /search_trend_blacklists/{id}.json:
    put:
      operationId: "updateSearchTrendBlacklist"
      x-access-level: "admin"
      tags:
        - "search_trend_blacklists"
      summary: "Update a search trend blacklist entry"
      description: "Updates the tag pattern or reason of an existing search trend blacklist entry."
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "The unique ID of the blacklist entry"
          schema:
            type: "integer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSearchTrendBlacklistBody"
      responses:
        204:
          description: "The blacklist entry was updated"
        403:
          description: "Access denied"
        404:
          description: "Blacklist entry not found"
        422:
          description: "Validation error"
    delete:
      operationId: "destroySearchTrendBlacklist"
      x-access-level: "admin"
      tags:
        - "search_trend_blacklists"
      summary: "Destroy a search trend blacklist entry"
      description: "Removes a search trend blacklist entry."
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "The unique ID of the blacklist entry"
          schema:
            type: "integer"
      responses:
        204:
          description: "The blacklist entry was destroyed"
        403:
          description: "Access denied"
        404:
          description: "Blacklist entry not found"
  /search_trend_hourlies.json:
    get:
      operationId: "getSearchTrendHourlies"
      x-access-level: "admin"
      tags:
        - "search_trend_hourlies"
      summary: "Get hourly search trends"
      description: "Returns the per-tag search counts recorded for a single hour, ordered by count descending then tag ascending."
      parameters:
        - name: "hour"
          in: "query"
          required: false
          description: "The hour to report on, truncated to the start of the UTC hour. Unparseable or missing values fall back to the current hour."
          schema:
            type: "string"
            format: "date-time"
        - name: "page"
          in: "query"
          required: false
          description: "The page number to retrieve"
          schema:
            type: "integer"
        - name: "limit"
          in: "query"
          required: false
          description: "The number of records to retrieve per page"
          schema:
            type: "integer"
        - name: "search[name_matches]"
          in: "query"
          required: false
          description: "Filter by tag name"
          schema:
            type: "string"
      responses:
        200:
          description: "A list of hourly search trend records"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/SearchTrendHourly"
        403:
          description: "Access denied"
        500:
          description: "Server error"
  /stats.json:
    get:
      operationId: "getStats"
      x-access-level: "anonymous"
      tags:
        - "stats"
      summary: "Get site statistics"
      description: "Returns the cached site-wide statistics snapshot. An empty object is returned when the snapshot has not been generated yet."
      responses:
        200:
          description: "The site statistics snapshot"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
        500:
          description: "Server error"
components:
  securitySchemes:
    BasicAuth:
      type: "http"
      scheme: "basic"
      description: "HTTP Basic with the account username and an API key from `/api_keys.json`. The account password is not accepted."
    ApiKeyLogin:
      type: "apiKey"
      in: "query"
      name: "login"
      description: |
        Account username. Must be sent together with `api_key`. The server reads
        this from `params`, so it may also be sent in the request body, which
        `in: "query"` cannot express.
    ApiKeyQuery:
      type: "apiKey"
      in: "query"
      name: "api_key"
      description: |
        API key from `/api_keys.json`. Must be sent together with `login`. The
        server reads this from `params`, so it may also be sent in the request
        body, which `in: "query"` cannot express.
  parameters:
    PostV2Flag:
      name: "v2"
      in: "query"
      required: false
      description: "If `\"true\"`, the response uses the v2 Post format. Otherwise the legacy format is returned."
      schema:
        type: "string"
        enum:
          - "true"
    PostV2Mode:
      name: "mode"
      in: "query"
      required: false
      description: "Selects the v2 Post payload shape. Only effective when `v2=true`. Default `basic`."
      schema:
        type: "string"
        enum:
          - "basic"
          - "extended"
          - "thumbnail"
          - "thumbnails"
  schemas:
    LegacyPost:
      type: "object"
      required:
        - "id"
        - "created_at"
        - "updated_at"
        - "file"
        - "preview"
        - "sample"
        - "score"
        - "tags"
        - "locked_tags"
        - "change_seq"
        - "flags"
        - "rating"
        - "fav_count"
        - "sources"
        - "pools"
        - "relationships"
        - "uploader_id"
        - "description"
        - "comment_count"
        - "has_notes"
      properties:
        id:
          type: "integer"
          description: "The unique ID of the post"
        created_at:
          type: "string"
          format: "date-time"
          description: "The time when the post was created"
        updated_at:
          type: "string"
          format: "date-time"
          description: "The last time the post was updated"
        file:
          $ref: "#/components/schemas/File"
        preview:
          $ref: "#/components/schemas/Preview"
        sample:
          $ref: "#/components/schemas/Sample"
        score:
          $ref: "#/components/schemas/Score"
        tags:
          $ref: "#/components/schemas/Tags"
        locked_tags:
          type: "array"
          items:
            type: "string"
          description: "An array of tags that are locked"
        change_seq:
          type: "integer"
          description: "The sequence number of changes to the post"
        flags:
          $ref: "#/components/schemas/Flags"
        rating:
          $ref: "#/components/schemas/PostRating"
        fav_count:
          type: "integer"
          description: "The number of times the post has been favorited"
        sources:
          type: "array"
          items:
            type: "string"
          description: "An array of sources for the post"
        pools:
          type: "array"
          items:
            type: "integer"
          description: "An array of pool IDs associated with the post"
        relationships:
          $ref: "#/components/schemas/Relationships"
        approver_id:
          type: "integer"
          nullable: true
          description: "The ID of the user who approved the post, if applicable"
        uploader_id:
          type: "integer"
          description: "The ID of the user who uploaded the post"
        uploader_name:
          type: "string"
          description: "The username of the user who uploaded the post"
        description:
          type: "string"
          description: "The description of the post"
        comment_count:
          type: "integer"
          description: "The number of comments on the post"
        is_favorited:
          type: "boolean"
          description: "Whether the post is favorited by the current user"
        vote:
          type: "integer"
          description: "The requesting user's vote on the post, `1`, `-1`, or `0` when they have not voted or are not logged in"
        has_notes:
          type: "boolean"
          description: "Whether the post has any notes attached"
        duration:
          type: "number"
          nullable: true
          description: "The duration of the post, if applicable"
    File:
      type: "object"
      required:
        - "width"
        - "height"
        - "ext"
        - "size"
        - "md5"
        - "url"
      properties:
        width:
          type: "integer"
          description: "The width of the file in pixels"
        height:
          type: "integer"
          description: "The height of the file in pixels"
        ext:
          $ref: "#/components/schemas/FileExt"
        size:
          type: "integer"
          description: "The size of the file in bytes"
        md5:
          type: "string"
          description: "The MD5 hash of the file"
        url:
          type: "string"
          nullable: true
          description: "The URL of the file"
    Preview:
      type: "object"
      required:
        - "width"
        - "height"
        - "url"
      properties:
        width:
          type: "integer"
          description: "The width of the preview in pixels"
        height:
          type: "integer"
          description: "The height of the preview in pixels"
        url:
          type: "string"
          nullable: true
          description: "The URL of the preview image"
        alt:
          type: "string"
          nullable: true
          description: "The URL of the WebP preview image"
    Sample:
      type: "object"
      required:
        - "has"
        - "height"
        - "width"
        - "url"
      properties:
        has:
          type: "boolean"
          description: "Whether the sample exists"
        height:
          type: "integer"
          description: "The height of the sample image in pixels"
        width:
          type: "integer"
          description: "The width of the sample image in pixels"
        url:
          type: "string"
          nullable: true
          description: "The URL of the sample image"
        alt:
          type: "string"
          nullable: true
          description: "The URL of the WebP sample image"
        alternates:
          $ref: "#/components/schemas/SampleAlternates"
    Score:
      type: "object"
      required:
        - "up"
        - "down"
        - "total"
      properties:
        up:
          type: "integer"
          description: "The number of upvotes on the post"
        down:
          type: "integer"
          description: "The number of downvotes on the post"
        total:
          type: "integer"
          description: "The total score (upvotes minus downvotes)"
    Tags:
      type: "object"
      required:
        - "general"
        - "artist"
        - "contributor"
        - "copyright"
        - "character"
        - "species"
        - "invalid"
        - "meta"
        - "lore"
      properties:
        general:
          type: "array"
          items:
            type: "string"
          description: "An array of general tags"
        artist:
          type: "array"
          items:
            type: "string"
          description: "An array of artist tags"
        contributor:
          type: "array"
          items:
            type: "string"
          description: "An array of contributor tags"
        copyright:
          type: "array"
          items:
            type: "string"
          description: "An array of copyright tags"
        character:
          type: "array"
          items:
            type: "string"
          description: "An array of character tags"
        species:
          type: "array"
          items:
            type: "string"
          description: "An array of species tags"
        invalid:
          type: "array"
          items:
            type: "string"
          description: "An array of invalid tags"
        meta:
          type: "array"
          items:
            type: "string"
          description: "An array of meta tags"
        lore:
          type: "array"
          items:
            type: "string"
          description: "An array of lore tags"
    Flags:
      type: "object"
      required:
        - "pending"
        - "flagged"
        - "note_locked"
        - "status_locked"
        - "rating_locked"
        - "deleted"
      properties:
        pending:
          type: "boolean"
          description: "Whether the post is pending approval"
        flagged:
          type: "boolean"
          description: "Whether the post is flagged"
        note_locked:
          type: "boolean"
          description: "Whether notes on the post are locked"
        status_locked:
          type: "boolean"
          description: "Whether the status of the post is locked"
        rating_locked:
          type: "boolean"
          description: "Whether the rating of the post is locked"
        deleted:
          type: "boolean"
          description: "Whether the post is deleted"
    Relationships:
      type: "object"
      required:
        - "has_children"
        - "has_active_children"
        - "children"
      properties:
        parent_id:
          type: "integer"
          nullable: true
          description: "The ID of the parent post, if applicable"
        has_children:
          type: "boolean"
          description: "Whether the post has any child posts"
        has_active_children:
          type: "boolean"
          description: "Whether the post has any active child posts"
        children:
          type: "array"
          items:
            type: "integer"
          description: "An array of child post IDs"
    UserProfile:
      type: "object"
      description: "A detailed representation of a user."
      required:
        - "id"
        - "name"
        - "created_at"
        - "level"
        - "base_upload_limit"
        - "upload_karma"
        - "upload_karma_free"
        - "post_upload_count"
        - "post_update_count"
        - "note_update_count"
        - "is_banned"
        - "can_approve_posts"
        - "can_upload_free"
        - "level_string"
      properties:
        wiki_page_version_count:
          type: "integer"
          description: "Number of wiki page versions created by the user"
        artist_version_count:
          type: "integer"
          description: "Number of artist versions created by the user"
        pool_version_count:
          type: "integer"
          description: "Number of pool versions created by the user"
        forum_post_count:
          type: "integer"
          description: "Number of forum posts created by the user"
        comment_count:
          type: "integer"
          description: "Number of comments made by the user"
        flag_count:
          type: "integer"
          description: "Number of flags made by the user"
        favorite_count:
          type: "integer"
          description: "Number of favorites added by the user"
        positive_feedback_count:
          type: "integer"
          description: "Number of positive feedbacks received by the user"
        neutral_feedback_count:
          type: "integer"
          description: "Number of neutral feedbacks received by the user"
        negative_feedback_count:
          type: "integer"
          description: "Number of negative feedbacks received by the user"
        upload_slots:
          type: "integer"
          description: "The number of upload slots available to the user"
        profile_about:
          type: "string"
          description: "The user's \"About\" profile section"
        profile_artinfo:
          type: "string"
          description: "The user's art information profile section"
        id:
          type: "integer"
          description: "The unique ID of the user"
        created_at:
          type: "string"
          format: "date-time"
          description: "The timestamp when the user account was created"
        name:
          type: "string"
          description: "The username of the user"
        level:
          type: "integer"
          description: "The user's access level (numerical)"
        base_upload_limit:
          type: "integer"
          description: "The base upload limit for the user"
        upload_karma:
          type: "integer"
          description: "The user's upload karma"
        upload_karma_free:
          type: "boolean"
          description: "Whether the user is exempt from the upload karma system"
        post_upload_count:
          type: "integer"
          description: "Number of posts uploaded by the user"
        post_update_count:
          type: "integer"
          description: "Number of post updates made by the user"
        note_update_count:
          type: "integer"
          description: "Number of note updates made by the user"
        is_banned:
          type: "boolean"
          description: "Whether the user is banned"
        can_approve_posts:
          type: "boolean"
          description: "Whether the user can approve posts"
        can_upload_free:
          type: "boolean"
          description: "Whether the user can upload without restrictions"
        level_string:
          type: "string"
          description: "The user's access level (textual description)"
        avatar_id:
          type: "integer"
          description: "The ID of the user's avatar image"
        is_verified:
          type: "boolean"
          description: "Whether the user has verified their email"
        has_cropped_avatar:
          type: "boolean"
          description: "Whether the user has a server-side cropped avatar"
    User:
      type: "object"
      description: "A simplified representation of a user with core attributes."
      required:
        - "id"
        - "created_at"
        - "name"
        - "level"
        - "base_upload_limit"
        - "upload_karma"
        - "upload_karma_free"
        - "post_upload_count"
        - "post_update_count"
        - "note_update_count"
        - "is_banned"
        - "can_approve_posts"
        - "can_upload_free"
        - "level_string"
      properties:
        id:
          type: "integer"
          description: "The unique ID of the user"
        created_at:
          type: "string"
          format: "date-time"
          description: "The timestamp when the user account was created"
        name:
          type: "string"
          description: "The username of the user"
        level:
          type: "integer"
          description: "The user's access level (numerical)"
        base_upload_limit:
          type: "integer"
          description: "The base upload limit for the user"
        upload_karma:
          type: "integer"
          description: "The user's upload karma"
        upload_karma_free:
          type: "boolean"
          description: "Whether the user is exempt from the upload karma system"
        post_upload_count:
          type: "integer"
          description: "Number of posts uploaded by the user"
        post_update_count:
          type: "integer"
          description: "Number of post updates made by the user"
        note_update_count:
          type: "integer"
          description: "Number of note updates made by the user"
        is_banned:
          type: "boolean"
          description: "Whether the user is banned"
        can_approve_posts:
          type: "boolean"
          description: "Whether the user can approve posts"
        can_upload_free:
          type: "boolean"
          description: "Whether the user can upload without restrictions"
        level_string:
          type: "string"
          description: "The user's access level (textual description)"
        avatar_id:
          type: "integer"
          description: "The ID of the user's avatar image"
        is_verified:
          type: "boolean"
          description: "Whether the user has verified their email"
        has_cropped_avatar:
          type: "boolean"
          description: "Whether the user has a server-side cropped avatar"
    Ticket:
      type: "object"
      description: "A ticket object representing a user complaint or moderation issue."
      required:
        - "id"
        - "creator_id"
        - "reason"
        - "disp_id"
        - "qtype"
        - "status"
        - "created_at"
        - "updated_at"
        - "response"
        - "handler_id"
      properties:
        id:
          type: "integer"
          description: "The unique ID of the ticket"
        creator_id:
          type: "integer"
          description: "The ID of the user who created the ticket"
        reason:
          type: "string"
          description: "The reason for the ticket"
        disp_id:
          type: "integer"
          description: "The ID of the reported content associated with the ticket"
        qtype:
          $ref: "#/components/schemas/TicketQtype"
        status:
          $ref: "#/components/schemas/TicketStatus"
        created_at:
          type: "string"
          format: "date-time"
          description: "The time when the ticket was created"
        updated_at:
          type: "string"
          format: "date-time"
          description: "The last time the ticket was updated"
        response:
          type: "string"
          description: "The response to the ticket"
        handler_id:
          type: "integer"
          description: "The ID of the user handling the ticket"
        claimant_id:
          type: "integer"
          nullable: true
          description: "The ID of the claimant user"
        report_reason:
          type: "string"
          nullable: true
          description: "The post report reason for the ticket"
        accused_id:
          type: "integer"
          nullable: true
          description: "The ID of the accused user"
    Appeal:
      type: "object"
      description: |
        An appeal raised against a moderation action (currently only flag appeals).
        Field visibility depends on viewer permissions: users without view access
        do not receive `creator_id`, `accused_id`, `reason`, or `response`; non-staff
        users do not receive `claimant_id`.
      required:
        - "id"
        - "creator_id"
        - "disp_id"
        - "qtype"
        - "status"
        - "reason"
        - "response"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "The unique ID of the appeal"
        creator_id:
          type: "integer"
          description: "The ID of the user who created the appeal"
        disp_id:
          type: "integer"
          description: "The ID of the appealed record (e.g. a PostFlag ID when `qtype=flag`)"
        qtype:
          $ref: "#/components/schemas/AppealQtype"
        status:
          $ref: "#/components/schemas/AppealStatus"
        reason:
          type: "string"
          description: "The reason given for the appeal"
        response:
          type: "string"
          description: "The handler's response to the appeal"
        claimant_id:
          type: "integer"
          nullable: true
          description: "The ID of the staff member currently claiming the appeal"
        handler_id:
          type: "integer"
          nullable: true
          description: "The ID of the staff member who last updated the appeal"
        accused_id:
          type: "integer"
          nullable: true
          description: "The ID of the user the appeal is filed against (e.g. the flag creator for flag appeals)"
        created_at:
          type: "string"
          format: "date-time"
          description: "The time the appeal was created"
        updated_at:
          type: "string"
          format: "date-time"
          description: "The last time the appeal was updated"
    UserFeedback:
      type: "object"
      description: "A user feedback object representing a piece of feedback left by a user."
      required:
        - "id"
        - "user_id"
        - "creator_id"
        - "created_at"
        - "body"
        - "category"
        - "updated_at"
        - "updater_id"
        - "is_deleted"
      properties:
