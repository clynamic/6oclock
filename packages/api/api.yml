openapi: "3.0.3"
info:
  title: "e621 API"
  version: "2da4b89799b7799a4920adfe14112939976b4fcd"
  description: |
    An API for accessing user information and other resources on e621 and e926.

    The `x-access-level` extension declares the minimum privilege level for an
    operation. Most values name a user level, and the level named plus every
    level above it is granted access. In ascending order the levels are
    `anonymous`, `blocked`, `member`, `privileged`, `former_staff`, `staff`,
    `janitor`, `moderator` and `admin`. The value `logged_in` means any
    authenticated account regardless of level.

    `approver`, `bd_staff` and `bd_auditor` name a per-user flag on the account
    instead of a level: `can_approve_posts`, `is_bd_staff` and `is_bd_auditor`.
servers:
  - url: "https://e621.net"
    description: "Production server for e621"
  - url: "https://e926.net"
    description: "SFW server for e926"
security:
  - {}
  - BasicAuth: []
  - ApiKeyLogin: []
    ApiKeyQuery: []
paths:
  /posts.json:
    get:
      operationId: "getPosts"
      x-access-level: "anonymous"
      tags:
        - "posts"
      summary: "Get a list of posts"
      description: |
        Returns a list of posts filtered by tags.
        
        When `v2=true`, the response uses the v2 Post format selected by `mode`
        (`basic` default, `extended`, or `thumbnail`). Otherwise the legacy
        format wrapped in `{ "posts": [...] }` is returned.
      parameters:
        - name: "page"
          in: "query"
          required: false
          description: "The page number for pagination"
          schema:
            type: "integer"
        - name: "limit"
          in: "query"
          required: false
          description: "The number of posts to retrieve per page"
          schema:
            type: "integer"
        - name: "tags"
          in: "query"
          required: false
          description: "Filter posts by tags"
          schema:
            type: "string"
        - $ref: "#/components/parameters/PostV2Flag"
        - $ref: "#/components/parameters/PostV2Mode"
      responses:
        200:
          description: "A list of posts matching the search criteria"
          content:
            application/json:
              schema:
                oneOf:
                  - type: "object"
                    x-format: "legacy"
                    x-wrapper: "posts"
                    description: "Legacy response (default, or when `v2` is not \"true\"). The post array is wrapped under `posts`."
                    properties:
                      posts:
                        type: "array"
                        items:
                          $ref: "#/components/schemas/LegacyPost"
                  - type: "array"
                    x-format: "v2"
                    x-mode: "basic"
                    description: "v2 basic format response (when `v2=true` and `mode` is unset or `basic`)."
                    items:
                      $ref: "#/components/schemas/BasicPost"
                  - type: "array"
                    x-format: "v2"
                    x-mode: "extended"
                    description: "v2 extended format response (when `v2=true` and `mode=extended`)."
                    items:
                      $ref: "#/components/schemas/Post"
                  - type: "array"
                    x-format: "v2"
                    x-mode: "thumbnail"
                    description: "v2 thumbnail format response (when `v2=true` and `mode=thumbnail`)."
                    items:
                      $ref: "#/components/schemas/ThumbnailPost"
        400:
          description: "Invalid request parameters"
        500:
          description: "Server error"
  /posts/{id}.json:
    get:
      operationId: "getPost"
      x-access-level: "anonymous"
      tags:
        - "posts"
      summary: "Get a post by ID"
      description: |
        Returns detailed information about a specific post identified by its ID.
        
        When `v2=true`, the response uses the v2 Post format selected by `mode`
        (`basic` default, `extended`, or `thumbnail`). Otherwise the legacy
        format wrapped in `{ "post": {...} }` is returned.
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "The unique ID of the post to retrieve"
          schema:
            type: "integer"
        - $ref: "#/components/parameters/PostV2Flag"
        - $ref: "#/components/parameters/PostV2Mode"
      responses:
        200:
          description: "Successful response containing post details"
          content:
            application/json:
              schema:
                oneOf:
                  - type: "object"
                    x-format: "legacy"
                    x-wrapper: "post"
                    description: "Legacy response (default, or when `v2` is not \"true\"). The post is wrapped under `post`."
                    properties:
                      post:
                        $ref: "#/components/schemas/LegacyPost"
                  - $ref: "#/components/schemas/BasicPost"
                    x-format: "v2"
                    x-mode: "basic"
                  - $ref: "#/components/schemas/Post"
                    x-format: "v2"
                    x-mode: "extended"
                  - $ref: "#/components/schemas/ThumbnailPost"
                    x-format: "v2"
                    x-mode: "thumbnail"
        404:
          description: "Post not found"
        500:
          description: "Server error"
    put:
      operationId: "updatePost"
      x-access-level: "member"
      tags:
        - "posts"
      summary: "Update a post"
      description: |
        Updates a post's tags, sources, rating, parent, or description.
        The set of accepted fields widens with the requester's level; sending a
        field above the requester's level is rejected with 403.

        `tag_string_diff` takes precedence over `tag_string`, and `source_diff`
        over `source`.

        When `v2=true`, the response uses the v2 Post format selected by `mode`
        (`basic` default, `extended`, or `thumbnail`). Otherwise the legacy
        format wrapped in `{ "post": {...} }` is returned.
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "The unique ID of the post to update"
          schema:
            type: "integer"
        - $ref: "#/components/parameters/PostV2Flag"
        - $ref: "#/components/parameters/PostV2Mode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePostBody"
      responses:
        200:
          description: "The post after the update was applied"
          content:
            application/json:
              schema:
                oneOf:
                  - type: "object"
                    x-format: "legacy"
                    x-wrapper: "post"
                    description: "Legacy response (default, or when `v2` is not \"true\"). The post is wrapped under `post`."
                    properties:
                      post:
                        $ref: "#/components/schemas/LegacyPost"
                  - $ref: "#/components/schemas/BasicPost"
                    x-format: "v2"
                    x-mode: "basic"
                  - $ref: "#/components/schemas/Post"
                    x-format: "v2"
                    x-mode: "extended"
                  - $ref: "#/components/schemas/ThumbnailPost"
                    x-format: "v2"
                    x-mode: "thumbnail"
        403:
          description: "Access denied, the edit throttle was hit, or a field above the requester's level was sent"
        404:
          description: "Post not found"
  /users.json:
    get:
      operationId: "getUsers"
      x-access-level: "anonymous"
      tags:
        - "users"
      summary: "Get a list of users"
      description: "Returns a list of users based on search criteria."
      parameters:
        - name: "page"
          in: "query"
          required: false
          description: "The page number to retrieve"
          schema:
            type: "integer"
        - name: "limit"
          in: "query"
          required: false
          description: "The number of users to retrieve per page"
          schema:
            type: "integer"
        - name: "search[id]"
          in: "query"
          required: false
          description: "Filter by user ID"
          schema:
            type: "string"
        - name: "search[name]"
          in: "query"
          required: false
          description: "Filter by username"
          schema:
            type: "string"
        - name: "search[about]"
          in: "query"
          required: false
          description: "Filter by user's \"About\" section"
          schema:
            type: "string"
        - name: "search[avatar_id]"
          in: "query"
          required: false
          description: "Filter by avatar ID"
          schema:
            type: "integer"
        - name: "search[level]"
          in: "query"
          required: false
          description: "Filter by user's access level"
          schema:
            type: "integer"
        - name: "search[min_level]"
          in: "query"
          required: false
          description: "Filter by minimum access level"
          schema:
            type: "integer"
        - name: "search[max_level]"
          in: "query"
          required: false
          description: "Filter by maximum access level"
          schema:
            type: "integer"
        - name: "search[can_upload_free]"
          in: "query"
          required: false
          description: "Filter by upload permissions"
          schema:
            type: "boolean"
        - name: "search[can_approve_posts]"
          in: "query"
          required: false
          description: "Filter by post approval permissions"
          schema:
            type: "boolean"
        - name: "search[order]"
          in: "query"
          required: false
          description: "Order the results by a specific field"
          schema:
            $ref: "#/components/schemas/GetUsersSearchOrder"
      responses:
        200:
          description: "A list of users matching the search criteria"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/User"
        400:
          description: "Invalid request parameters"
        500:
          description: "Server error"
    post:
      operationId: "createUser"
      x-access-level: "anonymous"
      tags:
        - "users"
      summary: "Create a new user account"
      description: "Registers a new user account. Only available when not logged in and signups are enabled."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        201:
          description: "User account created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        422:
          description: "Validation error"
  /users/{id}.json:
    get:
      operationId: "getUser"
      x-access-level: "anonymous"
      tags:
        - "users"
      summary: "Get user information by ID or username"
      description: "Returns detailed information about a user identified by their ID or username."
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "The ID or username of the user to retrieve"
          schema:
            type: "string"
            description: "Can be either the user's ID (integer) or username (string)"
      responses:
        200:
          description: "Successful response containing user details"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        404:
          description: "User not found"
        500:
          description: "Server error"
    patch:
      operationId: "updateUser"
      x-access-level: "logged_in"
      tags:
        - "users"
      summary: "Update the current user's settings"
      description: "Updates the currently authenticated user's account settings. Users can only update their own account unless they are an admin."
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "The ID of the user to update (must be the current user unless admin)"
          schema:
            type: "integer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        204:
          description: "User updated successfully"
        403:
          description: "Access denied"
        422:
          description: "Validation error"
  /users/me.json:
    get:
      operationId: "getCurrentUser"
      x-access-level: "anonymous"
      tags:
        - "users"
      summary: "Get the current authenticated user"
      description: "Returns the currently authenticated user's full profile information."
      responses:
        200:
          description: "Current user details"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        401:
          description: "Not authenticated"
  /users/{id}/upload_limit.json:
    get:
      operationId: "getUserUploadLimit"
      x-access-level: "logged_in"
      tags:
        - "users"
      summary: "Get a user's upload limit information"
      description: "Returns detailed upload limit information for a user."
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "The ID or username of the user"
          schema:
            type: "string"
      responses:
        200:
          description: "User upload limit information"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        404:
          description: "User not found"
  /dmails.json:
    get:
      operationId: "getDmails"
      x-access-level: "member"
      tags:
        - "dmails"
      summary: "Get a list of DMails"
      description: "Returns a list of DMails for the currently authenticated user."
      parameters:
        - name: "page"
          in: "query"
          required: false
          description: "The page number to retrieve"
          schema:
            type: "integer"
        - name: "limit"
          in: "query"
          required: false
          description: "The number of DMails to retrieve per page"
          schema:
            type: "integer"
        - name: "search[title_matches]"
          in: "query"
          required: false
          description: "Filter by title text"
          schema:
            type: "string"
        - name: "search[message_matches]"
          in: "query"
          required: false
          description: "Filter by message body text"
          schema:
            type: "string"
        - name: "search[to_name]"
          in: "query"
          required: false
          description: "Filter by recipient username"
          schema:
            type: "string"
        - name: "search[to_id]"
          in: "query"
          required: false
          description: "Filter by recipient user ID"
          schema:
            type: "integer"
        - name: "search[from_name]"
          in: "query"
          required: false
          description: "Filter by sender username"
          schema:
            type: "string"
        - name: "search[from_id]"
          in: "query"
          required: false
          description: "Filter by sender user ID"
          schema:
            type: "integer"
        - name: "search[is_read]"
          in: "query"
          required: false
          description: "Filter by read status"
          schema:
            type: "boolean"
        - name: "search[is_deleted]"
          in: "query"
          required: false
          description: "Filter by deleted status"
          schema:
            type: "boolean"
      responses:
        200:
          description: "A list of DMails"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Dmail"
        403:
          description: "Access denied"
  /dmails/{id}.json:
    get:
      operationId: "getDmail"
      x-access-level: "member"
      tags:
        - "dmails"
      summary: "Get a DMail by ID"
      description: "Returns a specific DMail. Only visible to the owner, or moderators for system/ticketed DMails."
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "The ID of the DMail"
          schema:
            type: "integer"
      responses:
        200:
          description: "DMail details"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dmail"
        403:
          description: "Access denied"
        404:
          description: "DMail not found"
    delete:
      operationId: "deleteDmail"
      x-access-level: "member"
      tags:
        - "dmails"
      summary: "Delete a DMail"
      description: "Marks a DMail as deleted and read."
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "The ID of the DMail"
          schema:
            type: "integer"
      responses:
        200:
          description: "DMail deleted"
        403:
          description: "Access denied"
        404:
          description: "DMail not found"
  /dmails/{id}/mark_as_read.json:
    put:
      operationId: "markDmailAsRead"
      x-access-level: "member"
      tags:
        - "dmails"
      summary: "Mark a DMail as read"
      description: "Marks a specific DMail as read and decrements the unread count."
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "The ID of the DMail"
          schema:
            type: "integer"
      responses:
        200:
          description: "DMail marked as read"
        403:
          description: "Access denied"
        404:
          description: "DMail not found"
  /dmails/{id}/mark_as_unread.json:
    put:
      operationId: "markDmailAsUnread"
      x-access-level: "member"
      tags:
        - "dmails"
      summary: "Mark a DMail as unread"
      description: "Marks a specific DMail as unread and increments the unread count."
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "The ID of the DMail"
          schema:
            type: "integer"
      responses:
        200:
          description: "DMail marked as unread"
        403:
          description: "Access denied"
        404:
          description: "DMail not found"
  /dmails/mark_all_as_read.json:
    put:
      operationId: "markAllDmailsAsRead"
      x-access-level: "member"
      tags:
        - "dmails"
      summary: "Mark all DMails as read"
      description: "Marks all of the current user's unread DMails as read and resets the unread count."
      responses:
        200:
          description: "All DMails marked as read"
        403:
          description: "Access denied"
  /api_keys.json:
    get:
      operationId: "getApiKeys"
      x-access-level: "member"
      tags:
        - "api_keys"
      summary: "Get a list of API keys"
      description: "Returns a list of the current user's API keys. Requires reauthentication."
      parameters:
        - name: "page"
          in: "query"
          required: false
          description: "The page number to retrieve"
          schema:
            type: "integer"
        - name: "limit"
          in: "query"
          required: false
          description: "The number of API keys to retrieve per page"
          schema:
            type: "integer"
        - name: "search[name_matches]"
          in: "query"
          required: false
          description: "Filter by key name"
          schema:
            type: "string"
        - name: "search[is_expired]"
          in: "query"
          required: false
          description: "Filter by expired status"
          schema:
            type: "boolean"
        - name: "search[order]"
          in: "query"
          required: false
          description: "Sort order"
          schema:
            type: "string"
      responses:
        200:
          description: "A list of API keys"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/ApiKey"
        403:
          description: "Access denied"
    post:
      operationId: "createApiKey"
      x-access-level: "member"
      tags:
        - "api_keys"
      summary: "Create a new API key"
      description: "Creates a new API key for the current user. Requires reauthentication."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyBody"
      responses:
        201:
          description: "API key created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        422:
          description: "Validation error"
  /api_keys/{id}.json:
    delete:
      operationId: "deleteApiKey"
      x-access-level: "member"
      tags:
        - "api_keys"
      summary: "Delete an API key"
      description: "Permanently deletes an API key. Requires reauthentication."
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "The ID of the API key"
          schema:
            type: "integer"
      responses:
        200:
          description: "API key deleted"
        404:
          description: "API key not found"
  /api_keys/{id}/regenerate.json:
    post:
      operationId: "regenerateApiKey"
      x-access-level: "member"
      tags:
        - "api_keys"
      summary: "Regenerate an expired API key"
      description: "Regenerates an expired API key with a new token and expiration. Only expired keys can be regenerated."
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "The ID of the API key"
          schema:
            type: "integer"
      responses:
        201:
          description: "API key regenerated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        422:
          description: "API key is not expired"
  /bans.json:
    get:
      operationId: "getBans"
      x-access-level: "anonymous"
      tags:
        - "bans"
      summary: "Get a list of bans"
      description: "Returns a list of bans based on search criteria."
      parameters:
        - name: "page"
          in: "query"
          required: false
          description: "The page number to retrieve"
          schema:
            type: "integer"
        - name: "limit"
          in: "query"
          required: false
          description: "The number of bans to retrieve per page"
          schema:
            type: "integer"
        - name: "search[user_id]"
          in: "query"
          required: false
          description: "Filter by banned user ID"
          schema:
            type: "integer"
        - name: "search[user_name]"
          in: "query"
          required: false
          description: "Filter by banned username"
          schema:
            type: "string"
        - name: "search[banner_id]"
          in: "query"
          required: false
          description: "Filter by staff user ID who issued the ban"
          schema:
            type: "integer"
        - name: "search[banner_name]"
          in: "query"
          required: false
          description: "Filter by staff username who issued the ban"
          schema:
            type: "string"
        - name: "search[reason_matches]"
          in: "query"
          required: false
          description: "Filter by ban reason text"
          schema:
            type: "string"
        - name: "search[expired]"
          in: "query"
          required: false
          description: "Filter by expired status (true = past bans, false = active bans)"
          schema:
            type: "boolean"
        - name: "search[order]"
          in: "query"
          required: false
          description: "Sort order"
          schema:
            $ref: "#/components/schemas/GetBansSearchOrder"
      responses:
        200:
          description: "A list of bans"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Ban"
        400:
          description: "Invalid request parameters"
  /bans/{id}.json:
    get:
      operationId: "getBan"
      x-access-level: "anonymous"
      tags:
        - "bans"
      summary: "Get a ban by ID"
      description: "Returns details of a specific ban."
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "The ID of the ban"
          schema:
            type: "integer"
      responses:
        200:
          description: "Ban details"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ban"
        404:
          description: "Ban not found"
  /user_name_change_requests.json:
    get:
      operationId: "getUserNameChangeRequests"
      x-access-level: "moderator"
      tags:
        - "user_name_change_requests"
      summary: "Get a list of name change requests"
      description: "Returns a list of user name change requests."
      parameters:
        - name: "page"
          in: "query"
          required: false
          description: "The page number to retrieve"
          schema:
            type: "integer"
        - name: "limit"
          in: "query"
          required: false
          description: "The number of requests to retrieve per page"
          schema:
            type: "integer"
        - name: "search[original_name]"
          in: "query"
          required: false
          description: "Filter by original username"
          schema:
            type: "string"
        - name: "search[desired_name]"
          in: "query"
          required: false
          description: "Filter by desired username"
          schema:
            type: "string"
      responses:
        200:
          description: "A list of name change requests"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/UserNameChangeRequest"
        403:
          description: "Access denied"
    post:
      operationId: "createUserNameChangeRequest"
      x-access-level: "member"
      tags:
        - "user_name_change_requests"
      summary: "Change the current user's name"
      description: "Files a name change request for the authenticated user, which is applied immediately."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserNameChangeRequestBody"
      responses:
        302:
          description: "Redirect to the created name change request"
        403:
          description: "Access denied"
  /user_name_change_requests/{id}.json:
    get:
      operationId: "getUserNameChangeRequest"
