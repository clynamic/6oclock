    SearchTrend:
      type: "object"
      description: "The number of times a tag was searched for on a given day."
      required:
        - "tag"
        - "count"
        - "day"
      properties:
        tag:
          type: "string"
          description: "The tag name"
        count:
          type: "integer"
          description: "The number of searches recorded for the day"
        day:
          type: "string"
          format: "date"
          description: "The day the searches were recorded on"
    SearchTrendPoint:
      type: "object"
      description: "One day of a tag's search history."
      required:
        - "count"
        - "day"
      properties:
        count:
          type: "integer"
          description: "The number of searches recorded for the day"
        day:
          type: "string"
          format: "date"
          description: "The day the searches were recorded on"
    RisingSearchTrend:
      type: "object"
      description: "A tag whose search volume rose sharply in the last 24 hours."
      required:
        - "name"
        - "pretty_name"
        - "post_count"
        - "category"
      properties:
        name:
          type: "string"
          description: "The tag name"
        pretty_name:
          type: "string"
          description: "The tag name with underscores replaced by spaces"
        post_count:
          type: "integer"
          description: "The number of posts with this tag, or 0 if the tag does not exist"
        category:
          type: "integer"
          description: "The tag category, or 0 if the tag does not exist"
    SearchTrendPurgeResult:
      type: "object"
      description: "The number of search trend records deleted by a purge."
      required:
        - "daily_count"
        - "hourly_count"
      properties:
        daily_count:
          type: "integer"
          description: "The number of daily records deleted"
        hourly_count:
          type: "integer"
          description: "The number of hourly records deleted"
    SearchTrendSettingsResult:
      type: "object"
      description: "The outcome of a search trend settings or cache operation."
      required:
        - "success"
        - "message"
      properties:
        success:
          type: "boolean"
          description: "Always true"
        message:
          type: "string"
          description: "A human readable description of what was done"
    UpdateSearchTrendSettingsBody:
      type: "object"
      properties:
        search_trend_settings:
          $ref: "#/components/schemas/UpdateSearchTrendSettingsBodySearchTrendSettings"
    UpdateSearchTrendSettingsBodySearchTrendSettings:
      type: "object"
      properties:
        trends_enabled:
          type: "boolean"
          description: "Whether search trend recording is enabled"
        trends_displayed:
          type: "boolean"
          description: "Whether search trends are displayed on the site"
        trends_min_today:
          type: "integer"
          description: "The minimum number of searches in the current window for a tag to be rising"
        trends_min_delta:
          type: "integer"
          description: "The minimum increase over the previous window for a tag to be rising"
        trends_min_ratio:
          type: "number"
          description: "The minimum ratio between the current and previous window for a tag to be rising"
        trends_ip_limit:
          type: "integer"
          description: "The number of recordings allowed per IP address within the IP window"
        trends_ip_window:
          type: "integer"
          description: "The IP rate limit window, in seconds"
        trends_tag_limit:
          type: "integer"
          description: "The number of recordings allowed per tag within the tag window"
        trends_tag_window:
          type: "integer"
          description: "The tag rate limit window, in seconds"
    SearchTrendHourly:
      type: "object"
      description: "The number of times a tag was searched for during a given hour."
      required:
        - "tag"
        - "count"
        - "hour"
        - "processed"
      properties:
        tag:
          type: "string"
          description: "The tag name"
        count:
          type: "integer"
          description: "The number of searches recorded for the hour"
        hour:
          type: "string"
          format: "date-time"
          description: "The start of the hour the searches were recorded in"
        processed:
          type: "boolean"
          description: "Whether the record has been rolled up into the daily totals"
    SearchTrendBlacklist:
      type: "object"
      description: "A tag pattern excluded from search trend recording."
      required:
        - "id"
        - "tag"
        - "reason"
        - "creator_id"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "The unique ID of the blacklist entry"
        tag:
          type: "string"
          description: "The blacklisted tag pattern, supporting the `*` and `?` globs"
        reason:
          type: "string"
          description: "The reason for blacklisting"
        creator_id:
          type: "integer"
          description: "The ID of the user who created the entry"
        created_at:
          type: "string"
          format: "date-time"
          description: "When the entry was created"
        updated_at:
          type: "string"
          format: "date-time"
          description: "When the entry was last updated"
    GetSearchTrendBlacklistsSearchOrder:
      type: "string"
      enum:
        - "id_asc"
        - "id_desc"
    CreateSearchTrendBlacklistBody:
      type: "object"
      required:
        - "search_trend_blacklist"
      properties:
