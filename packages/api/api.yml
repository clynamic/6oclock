    get:
      operationId: "getVoteTrends"
      x-access-level: "staff"
      tags:
        - "staff"
      summary: "Get post vote trends for a user"
      description: >
        Returns the tags, uploaders and ratings that a user's recent post votes cluster around,
        weighted by site-wide usage. Each entry is a two-element array of the trend subject and
        its score. Returns an empty array when `user` is missing or does not resolve to a user.
        Requires staff-level access.
      parameters:
        - name: "user"
          in: "query"
          required: false
          description: "The username of the user to analyse, or the user ID prefixed with `!`"
          schema:
            type: "string"
        - name: "limit"
          in: "query"
          required: false
          description: "The number of the user's most recent post votes to analyse"
          schema:
            type: "integer"
        - name: "threshold"
          in: "query"
          required: false
          description: "Minimum absolute weighted score for an entry to be returned"
          schema:
            type: "number"
        - name: "duration"
          in: "query"
          required: false
          description: "Only consider votes updated within this many days"
          schema:
            type: "number"
        - name: "disable_vote_normality"
          in: "query"
          required: false
          description: "Set to a non-zero integer to skip weighting votes by the post's score ratio"
          schema:
            type: "integer"
      responses:
        200:
          description: "A list of `[subject, score]` pairs, ordered by ascending score"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  type: "array"
                  description: "A two-element array: the trend subject followed by its weighted score"
                  items: {}
        403:
          description: "Access denied"
