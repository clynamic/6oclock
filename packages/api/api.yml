      summary: "Exchange an authorization code or refresh token for an access token"
      description: |
        The only grant flow enabled is `authorization_code`, and PKCE is required
        with the `S256` challenge method. Refresh tokens are issued.
      requestBody:
        required: true
        content:
          application/json:
