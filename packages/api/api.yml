                  - $ref: "#/components/schemas/BasicPost"
                    x-format: "v2"
                    x-mode: "basic"
                  - $ref: "#/components/schemas/Post"
                    x-format: "v2"
                    x-mode: "extended"
                  - $ref: "#/components/schemas/ThumbnailPost"
                    x-format: "v2"
                    x-mode: "thumbnail"
