          description: "Newline-separated artist URLs"
        notes:
          type: "string"
          description: "The body of the artist's wiki page"
        linked_user_id:
          type: "integer"
          description: "The ID of the linked user account (staff only)"
        is_locked:
          type: "boolean"
          description: "Whether the artist page is locked (staff only)"
    CreateTakedownBody:
      type: "object"
      required:
        - "takedown"
      properties:
        takedown:
          $ref: "#/components/schemas/CreateTakedownBodyTakedown"
    CreateTakedownBodyTakedown:
      type: "object"
      required:
        - "email"
        - "reason"
      properties:
        email:
          type: "string"
          description: "The contact email address for the request"
        source:
          type: "string"
          description: "The source the content was taken from"
        instructions:
          type: "string"
          description: "Instructions for handling the request"
        reason:
          type: "string"
          description: "The reason for the takedown"
        post_ids:
          type: "string"
          description: "Post IDs or post URLs to take down; digit runs are extracted from the value"
        reason_hidden:
          type: "boolean"
          description: "Whether the reason is hidden from non-staff"
        notes:
          type: "string"
          description: "Staff notes for the takedown (BD staff only)"
        del_post_ids:
          type: "string"
          description: "Post IDs to mark for deletion (BD staff only)"
        status:
          allOf:
            - $ref: "#/components/schemas/TakedownStatus"
          description: "The takedown status (BD staff only). A create always overwrites this with \"pending\"."

    TagCorrection:
      type: "object"
      required:
        - "post_count"
        - "real_post_count"
        - "category"
        - "category_cache"
        - "tag"
      properties:
        post_count:
          type: "integer"
          description: "The post count currently stored on the tag"
        real_post_count:
          type: "integer"
          description: "The post count reported by the search index"
        category:
          type: "integer"
          description: "The category ID currently stored on the tag"
        category_cache:
          type: "integer"
          nullable: true
          description: "The cached category ID for the tag, null when the cache entry has expired"
        tag:
          $ref: "#/components/schemas/Tag"
    UpdateTagAliasBody:
      type: "object"
      properties:
        tag_alias[antecedent_name]:
          type: "string"
          description: "The name of the antecedent tag, only applied while the alias is pending"
        tag_alias[consequent_name]:
          type: "string"
          description: "The name of the consequent tag, only applied while the alias is pending"
        tag_alias[forum_topic_id]:
          type: "integer"
          description: "The ID of the forum topic to link to"
    UpdateTagImplicationBody:
      type: "object"
      properties:
        tag_implication[antecedent_name]:
          type: "string"
          description: "The name of the antecedent tag"
        tag_implication[consequent_name]:
          type: "string"
          description: "The name of the consequent tag"
        tag_implication[forum_topic_id]:
          type: "integer"
          description: "The ID of the forum topic to link to"
    CreateTagCorrectionBody:
      type: "object"
      properties:
        commit:
          type: "string"
          enum:
            - "Fix"
          description: "Must be Fix for the correction to be queued"
        from_wiki:
          type: "boolean"
          description: "Redirect to the tag's wiki page instead of the tag search"

    StaffWiki:
      type: "object"
      description: "A staff-only wiki page."
      required:
        - "id"
        - "creator_id"
        - "updater_id"
        - "title"
        - "body"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "The unique ID of the staff wiki page"
        creator_id:
          type: "integer"
          description: "The ID of the user who created the page"
        updater_id:
          type: "integer"
          description: "The ID of the user who last updated the page"
        claimant_id:
          type: "integer"
          nullable: true
          description: "The ID of the user currently claiming the page"
        title:
          type: "string"
          description: "The title of the page"
        body:
          type: "string"
          description: "The DText body of the page"
        created_at:
          type: "string"
          format: "date-time"
          description: "When the page was created"
        updated_at:
          type: "string"
          format: "date-time"
          description: "When the page was last updated"
    StaffWikiVersion:
      type: "object"
      description: "A past revision of a staff wiki page."
      required:
        - "id"
        - "staff_wiki_id"
        - "updater_id"
        - "title"
        - "body"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "The unique ID of the version"
        staff_wiki_id:
          type: "integer"
          description: "The ID of the staff wiki page this version belongs to"
        updater_id:
          type: "integer"
          description: "The ID of the user who made the edit"
        claimant_id:
          type: "integer"
          nullable: true
          description: "The ID of the user claiming the page at the time of the edit"
        title:
          type: "string"
          description: "The title of the page in this version"
        body:
          type: "string"
          description: "The DText body of the page in this version"
        created_at:
          type: "string"
          format: "date-time"
          description: "When the version was created"
        updated_at:
          type: "string"
          format: "date-time"
          description: "When the version was last updated"
    StaffFile:
      type: "object"
      description: "A file uploaded to the staff file store."
      required:
        - "id"
        - "creator_id"
        - "storage_id"
        - "md5"
        - "file_ext"
        - "file_size"
        - "original_filename"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "The unique ID of the staff file"
        creator_id:
          type: "integer"
          description: "The ID of the user who uploaded the file"
        storage_id:
          type: "string"
          description: "The random identifier the file is stored under"
        md5:
          type: "string"
          description: "The MD5 hash of the file contents"
        file_ext:
          type: "string"
          description: "The file extension, lowercased, with `jpeg` normalized to `jpg`"
        file_size:
          type: "integer"
          description: "The size of the file in bytes"
        original_filename:
          type: "string"
          description: "The filename the file was uploaded under"
        title:
          type: "string"
          nullable: true
          description: "The display title, defaulting to the original filename"
        description:
          type: "string"
          nullable: true
          description: "A free-text description of the file"
        created_at:
          type: "string"
          format: "date-time"
          description: "When the file was uploaded"
        updated_at:
          type: "string"
          format: "date-time"
          description: "When the file record was last updated"
    ExceptionLog:
      type: "object"
      description: "A recorded server exception."
      required:
        - "id"
        - "class_name"
        - "version"
        - "message"
        - "trace"
        - "code"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "The unique ID of the exception log"
        class_name:
          type: "string"
          description: "The class name of the raised exception"
        version:
          type: "string"
          description: "The application version the exception was raised on"
        message:
          type: "string"
          description: "The exception message"
        trace:
          type: "string"
          description: "The newline-separated backtrace"
        code:
          type: "string"
          format: "uuid"
          description: "The public code shown to the user who hit the error"
        extra_params:
          type: "object"
          nullable: true
          description: "Request context captured with the exception, including the host, filtered request params, referrer and user agent"
        user_id:
          type: "integer"
          nullable: true
          description: "The ID of the user whose request raised the exception"
        created_at:
          type: "string"
          format: "date-time"
          description: "When the exception was recorded"
        updated_at:
          type: "string"
          format: "date-time"
          description: "When the exception log was last updated"
    GetStaffWikisSearchOrder:
